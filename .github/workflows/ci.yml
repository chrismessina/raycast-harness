name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    # macOS: rx reads Raycast.app's Info.plist with plutil, which exists only there.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check JSDoc
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests (includes fixtures vs expected.json)
        run: npm test
      - name: Commit-message hook rejects session URLs
        run: node --test test/commit-msg.test.mjs
